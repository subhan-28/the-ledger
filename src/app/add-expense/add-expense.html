<div class="ledger-page">
  <div class="margin-line"></div>

  <header class="ledger-header">
    <span class="eyebrow">{{ isEditMode() ? 'Amend Record' : 'New Record' }}</span>
    <h1>{{ isEditMode() ? 'Edit Entry' : 'New Entry' }}</h1>
    <div class="header-rule"></div>
  </header>

  <div class="ledger-body">
    <form class="entry-form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field">
        <label for="amount">Amount</label>
        <div class="amount-wrap">
          <span class="currency-sign">Rs.</span>
          <input
            id="amount"
            type="number"
            [(ngModel)]="amount"
            name="amount"
            placeholder="0.00"
            step="0.01"
            min="0"
            autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category" [(ngModel)]="category" name="category">
          <option value="" disabled>Select a category</option>
          <option *ngFor="let cat of categories" [value]="cat.name">{{ cat.name }}</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Date</label>
        <input
          id="date"
          type="date"
          [(ngModel)]="date"
          name="date">
      </div>

      <div class="field">
        <label for="note">Note <span class="optional">(optional)</span></label>
        <input
          id="note"
          type="text"
          [(ngModel)]="note"
          name="note"
          placeholder="e.g. Lunch with friends"
          autocomplete="off">
      </div>

      <p class="error-msg" *ngIf="errorMsg()">{{ errorMsg() }}</p>

      <div class="action-row">
        <button type="submit" class="btn-primary">
          {{ isEditMode() ? 'Save Changes' : 'Add to Ledger' }}
        </button>
        <a routerLink="/" class="btn-secondary">Cancel</a>
      </div>

    </form>
  </div>
</div>
