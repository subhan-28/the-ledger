<div class="ledger-page">
  <div class="margin-line"></div>

  <header class="ledger-header">
    <span class="eyebrow">Personal Finance Journal</span>
    <h1>The Ledger</h1>
    <div class="header-rule"></div>
  </header>

  <div class="ledger-body">

    <div class="empty-state" *ngIf="expenseService.expenses().length === 0">
      <p class="empty-text">No entries recorded yet.</p>
      <a routerLink="/add" class="btn-primary">+ New Entry</a>
    </div>

    <ng-container *ngIf="expenseService.expenses().length > 0">

      <div class="summary-row">
        <div class="stamp-box">
          <span class="stamp-label">Total Spent</span>
          <span class="stamp-amount">Rs. {{ totalDisplay() }}</span>
        </div>
        <div class="stamp-box">
          <span class="stamp-label">This Month</span>
          <span class="stamp-amount">Rs. {{ monthDisplay() }}</span>
        </div>
      </div>

      <div class="category-section">
        <span class="section-label">By Category</span>
        <div
          class="category-row"
          *ngFor="let cat of expenseService.categoryBreakdown(); let i = index"
          [style.animationDelay.ms]="i * 60">
          <div class="cat-top">
            <span class="cat-dot" [style.background]="getCategoryColor(cat.category)"></span>
            <span class="cat-name">{{ cat.category }}</span>
            <span class="cat-amount">Rs. {{ formatCurrency(cat.amount) }}</span>
          </div>
          <div class="cat-bar-track">
            <div class="cat-bar-fill"
                 [style.width.%]="(cat.amount / expenseService.total()) * 100"
                 [style.background]="getCategoryColor(cat.category)"></div>
          </div>
        </div>
      </div>

      <div class="action-row">
        <a routerLink="/add" class="btn-primary">+ New Entry</a>
        <a routerLink="/ledger" class="btn-secondary">View Ledger</a>
      </div>

    </ng-container>

  </div>
</div>
